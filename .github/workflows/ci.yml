name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality-gate:
    name: V1 Quality Gate
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Code quality check
        run: pnpm check

      - name: Typecheck
        run: pnpm exec turbo typecheck --force

      - name: Run tests
        run: pnpm test
        env:
          NODE_ENV: test
          DATABASE_URL: postgresql://schedlane:schedlane@localhost:5432/schedlane
          BETTER_AUTH_SECRET: schedlane-integration-test-secret-only
          BETTER_AUTH_URL: http://localhost:3000
          WEB_ORIGIN: http://localhost:5173
          EMAIL_PROVIDER: console
          GUEST_MANAGEMENT_TOKEN_ENCRYPTION_KEY: a2tra2tra2tra2tra2tra2tra2tra2tra2tra2tra2s=
          RABBITMQ_URL: amqp://schedlane:schedlane@localhost:5672
          PLATFORM_NOTIFICATION_EMAIL: schedlane.app@gmail.com

      - name: Build
        run: pnpm build
